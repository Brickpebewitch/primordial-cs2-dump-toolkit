[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "primordial-cs2-dump-toolkit"
version = "0.6.3"
description = "Plugin-host toolkit for dumping CS2 offsets, schemas, and netvars."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "primordial-dump maintainers" }]
keywords = ["cs2", "offsets", "schema", "netvars", "dumper", "reverse-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]

dependencies = [
  "pydantic>=2.7,<3",
  "tomli-w>=1.0",
  "rich>=13.7",
  "pymem>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
cxx = ["pybind11>=2.12"]

[project.scripts]
primordial-dump = "primordial_dump.__main__:main"

[project.entry-points."primordial_dump.plugins"]
schema_reader = "plugins.schema_reader.plugin:SchemaReader"
netvar_scanner = "plugins.netvar_scanner.plugin:NetvarScanner"
offset_walker = "plugins.offset_walker.plugin:OffsetWalker"
sig_scan = "plugins.sig_scan.plugin:SigScan"

[tool.hatch.build.targets.wheel]
packages = ["primordial_dump", "plugins", "core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true